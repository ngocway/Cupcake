<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Băng Chuyền Thả Khối</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&family=Orbitron:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0; padding: 0; overflow: hidden;
            background-color: #1e1e2f; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        .play-btn {
            background: #ff6b6b;
            color: white;
            font-family: 'Fredoka One', 'Nunito', cursive;
            font-size: 2.8rem;
            padding: 22px 64px;
            border: 8px solid white;
            border-radius: 60px;
            cursor: pointer;
            pointer-events: auto !important;
            position: relative;
            z-index: 9999;
            box-shadow: 0 12px 0 #ee5253, 0 20px 35px rgba(0,0,0,0.4);
            transition: transform 0.15s, box-shadow 0.15s;
            text-transform: uppercase;
            letter-spacing: 3px;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .play-btn:hover  { transform: translateY(-4px) scale(1.05); box-shadow: 0 16px 0 #ee5253, 0 25px 40px rgba(0,0,0,0.45); }
        .play-btn:active { transform: translateY(6px) scale(0.96);  box-shadow: 0 2px 0 #ee5253, 0 6px 12px rgba(0,0,0,0.2); }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #2a2a40 0%, #11111a 100%);
            overflow: hidden;
        }

        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(#3f3f5a 2px, transparent 2px),
                radial-gradient(#3f3f5a 2px, transparent 2px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.2; pointer-events: none;
        }

        .gear {
            position: absolute; border-radius: 50%;
            border: 15px dashed #47476b; opacity: 0.15;
            animation: spin 20s linear infinite; pointer-events: none;
        }
        .gear-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .gear-2 { width: 400px; height: 400px; bottom: -150px; right: -150px; animation-direction: reverse; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        canvas {
            display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none;
        }

        .panel-3d {
            background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
            border: 4px solid #4b5563;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 4px 0 rgba(255,255,255,0.1);
            pointer-events: auto;
        }

        .led-screen {
            background: #0f172a;
            border: 3px solid #334155;
            border-radius: 16px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8), 0 2px 0 rgba(255,255,255,0.1);
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px currentColor;
        }

        .btn-chunky {
            pointer-events: auto; cursor: pointer;
            border-radius: 20px;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .btn-chunky:active {
            transform: translateY(8px);
        }
        
        .btn-green {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            box-shadow: 0 8px 0 #15803d, 0 15px 20px rgba(0,0,0,0.4), inset 0 4px 0 rgba(255,255,255,0.3);
        }
        .btn-green:active { box-shadow: 0 0px 0 #15803d, 0 5px 10px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.3); }

        .btn-blue {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            box-shadow: 0 8px 0 #0369a1, 0 15px 20px rgba(0,0,0,0.4), inset 0 4px 0 rgba(255,255,255,0.3);
        }
        .btn-blue:active { box-shadow: 0 0px 0 #0369a1, 0 5px 10px rgba(0,0,0,0.4); }

        .btn-red {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            box-shadow: 0 8px 0 #b91c1c, 0 15px 20px rgba(0,0,0,0.4), inset 0 4px 0 rgba(255,255,255,0.3);
        }
        .btn-red:active { box-shadow: 0 0px 0 #b91c1c, 0 5px 10px rgba(0,0,0,0.4); }

        .btn-yellow {
            background: linear-gradient(180deg, #fde047 0%, #ca8a04 100%);
            box-shadow: 0 8px 0 #a16207, 0 15px 20px rgba(0,0,0,0.4), inset 0 4px 0 rgba(255,255,255,0.3);
            color: #451a03; text-shadow: 0 2px 2px rgba(255,255,255,0.5);
        }
        .btn-yellow:active { box-shadow: 0 0px 0 #a16207, 0 5px 10px rgba(0,0,0,0.4); }

        .btn-circle {
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }

        .combo-badge { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) alternate infinite; }
        @keyframes pop { 0% { transform: scale(1) rotate(-5deg); } 100% { transform: scale(1.15) rotate(5deg); } }

        .red-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(220, 38, 38, 0.35); z-index: 15; pointer-events: none;
            opacity: 0; transition: opacity 0.1s; mix-blend-mode: overlay;
        }
        .red-flash.active { opacity: 1; }

        .screen-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 3px, 0); }
            20%, 80% { transform: translate3d(5px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 5px, 0); }
            40%, 60% { transform: translate3d(8px, -5px, 0); }
        }

        .modal-overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 9999;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .modal-overlay.active {
            display: flex !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        .modal-content {
            transform: scale(0.8) translateY(50px); opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="bg-pattern"></div>
    <div class="gear gear-1"></div>
    <div class="gear gear-2"></div>
    <div id="red-flash" class="red-flash"></div>
    
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="modal-overlay active">
        <button class="play-btn" id="btn-start" onclick="handleGlobalStartPlay(event)">▶ PLAY</button>
    </div>

    <div id="ui-layer" class="flex flex-col justify-between">
        <!-- Top HUD -->
        <div class="m-3 p-2 flex justify-between items-center text-white relative pointer-events-auto bg-transparent">
            <!-- Score -->
            <div class="flex items-center space-x-3 w-1/3 px-2">
                <div class="led-screen px-4 py-2 flex items-center text-cyan-400">
                    <span class="text-sm text-cyan-700 mr-2 mt-1">SCORE</span>
                    <span id="score" class="text-3xl font-black tracking-widest">0000</span>
                </div>
                <div id="combo-badge" class="hidden bg-gradient-to-r from-yellow-300 to-orange-500 text-black border-2 border-white rounded-xl px-3 py-1 font-black shadow-[0_4px_10px_rgba(250,204,21,0.5)] transform -rotate-6 text-lg">
                    x2 COMBO!
                </div>
            </div>

            <!-- Title Header -->
            <div class="flex justify-center w-1/3">
                <div class="led-screen px-6 py-2 flex items-center space-x-2 text-cyan-400">
                    <span id="topic-title" class="text-xl font-black tracking-wide truncate max-w-[220px]">Băng Chuyền Thả Khối</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-end space-x-4 w-1/3 px-2">
                <button id="btn-pause" class="btn-chunky btn-red btn-circle">⏸</button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="modal-overlay">
            <div class="modal-content panel-3d p-8 max-w-md text-center w-[90%] border-t-8 border-yellow-400 relative">
                <h1 id="end-title" class="text-3xl font-black text-yellow-400 mb-2 font-['Orbitron'] drop-shadow-lg uppercase">
                    HOÀN THÀNH VÒNG
                </h1>
                <p id="end-message" class="text-lg text-gray-300 font-bold mb-6">Bạn đã thu thập xong đồ chơi!</p>
                
                <div class="led-screen p-6 mb-6 text-cyan-400 shadow-inner flex flex-col space-y-4">
                    <div class="flex justify-between items-end border-b border-cyan-900 pb-2">
                        <span class="text-cyan-700 font-bold">TỔNG ĐIỂM</span>
                        <span id="final-score" class="text-5xl font-black">0000</span>
                    </div>
                </div>

                <div class="flex flex-col space-y-3">
                    <button id="btn-next-round" class="btn-chunky btn-green w-full py-4 text-2xl font-black text-white hidden">
                        ▶ VÒNG TIẾP THEO
                    </button>
                    <button id="btn-restart" class="btn-chunky btn-blue w-full py-4 text-2xl font-black text-white">
                        🔄 CHƠI LẠI TỪ ĐẦU
                    </button>
                </div>
            </div>
        </div>

        <!-- Pause Modal -->
        <div id="pause-modal" class="modal-overlay">
            <div class="modal-content panel-3d p-8 text-center w-[350px] border-t-8 border-red-500">
                <h1 class="text-3xl font-black text-white mb-6 font-['Orbitron']">TẠM DỪNG</h1>
                <div class="flex flex-col space-y-4">
                    <button id="btn-resume" class="btn-chunky btn-green py-3 text-xl font-bold text-white">▶ TIẾP TỤC</button>
                    <button id="btn-quit" class="btn-chunky btn-red py-3 text-xl font-bold text-white">✖ THOÁT GAME</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let VOCABULARY = [
        { id: 1, icon: "🍎", text: "Quả Táo", imageUrl: null, audioUrl: null, color1: "#ff4b4b", color2: "#990000" },
        { id: 2, icon: "🐯", text: "Con Hổ", imageUrl: null, audioUrl: null, color1: "#ffa033", color2: "#b35900" },
        { id: 3, icon: "⭐", text: "Ngôi Sao", imageUrl: null, audioUrl: null, color1: "#ffd633", color2: "#997a00" },
        { id: 4, icon: "🚗", text: "Xe Ô tô", imageUrl: null, audioUrl: null, color1: "#4da6ff", color2: "#004d99" }
    ];

    const COLOR_PALETTES = [
        { color1: "#ff4b4b", color2: "#990000" },
        { color1: "#ffa033", color2: "#b35900" },
        { color1: "#ffd633", color2: "#997a00" },
        { color1: "#4da6ff", color2: "#004d99" },
        { color1: "#33cc99", color2: "#006644" },
        { color1: "#b366ff", color2: "#4d0099" },
        { color1: "#ff66d9", color2: "#990066" },
        { color1: "#ff3366", color2: "#990026" },
        { color1: "#33ccff", color2: "#007399" },
        { color1: "#33e6cc", color2: "#008073" }
    ];

    const imageCache = {};

    function getLoadedImage(url) {
        if (!url) return null;
        
        let targetUrl = url;
        if ((url.startsWith('http://') || url.startsWith('https://')) && !url.includes(window.location.host) && !url.includes('.r2.dev')) {
            targetUrl = `/api/proxy-image?url=${encodeURIComponent(url)}`;
        }

        if (imageCache[targetUrl]) return imageCache[targetUrl];
        const img = new Image();
        img.src = targetUrl;
        img.onerror = () => {
            if (targetUrl !== url) {
                img.src = url;
            }
        };
        imageCache[targetUrl] = img;
        return img;
    }

    const AudioSys = {
        ctx: null, soundEnabled: true,
        init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        toggle() { this.soundEnabled = !this.soundEnabled; return this.soundEnabled; },
        playAudioUrl(url) {
            if (!this.soundEnabled || !url) return;
            try {
                const audio = new Audio(url);
                audio.play().catch(() => {});
            } catch(e) {}
        },
        speak(text) {
            if (!this.soundEnabled || !text) return;
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'en-US'; u.rate = 0.9;
                    window.speechSynthesis.speak(u);
                }
            } catch(e) {}
        },
        play(type) {
            if (!this.soundEnabled || !this.ctx) return;
            const now = this.ctx.currentTime;
            
            const playOsc = (type, fStart, fEnd, tStart, dur, vStart, vEnd) => {
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(fStart, tStart);
                if(fEnd) osc.frequency.exponentialRampToValueAtTime(fEnd, tStart + dur);
                gain.gain.setValueAtTime(vStart, tStart);
                gain.gain.exponentialRampToValueAtTime(Math.max(vEnd, 0.001), tStart + dur);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(tStart); osc.stop(tStart + dur);
            };

            switch (type) {
                case 'click': playOsc('sine', 600, 900, now, 0.1, 0.2, 0); break;
                case 'drop': 
                    playOsc('square', 300, 100, now, 0.2, 0.1, 0); 
                    playOsc('sine', 150, 50, now, 0.2, 0.2, 0); break;
                case 'correct':
                    playOsc('sine', 880, null, now, 0.3, 0.3, 0);
                    playOsc('triangle', 1108.7, null, now + 0.05, 0.4, 0.2, 0);
                    playOsc('sine', 1318.5, null, now + 0.1, 0.5, 0.2, 0);
                    break;
                case 'wrong':
                    playOsc('sawtooth', 200, 80, now, 0.4, 0.2, 0);
                    playOsc('square', 100, 40, now, 0.4, 0.2, 0); break;
                case 'combo':
                    [440, 554, 659, 880].forEach((f, i) => playOsc('square', f, f*1.2, now + i*0.06, 0.2, 0.1, 0));
                    break;
                case 'win':
                    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                        playOsc('triangle', f, f, now + i*0.1, 1.5, 0.2, 0);
                        playOsc('sine', f/2, f/2, now + i*0.1, 1.5, 0.2, 0);
                    });
                    break;
            }
        }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth, ch = window.innerHeight;
    canvas.width = cw; canvas.height = ch;

    window.addEventListener('resize', () => {
        cw = window.innerWidth; ch = window.innerHeight;
        canvas.width = cw; canvas.height = ch;
        Game.calculateLayout();
    });

    const rand = (min, max) => Math.random() * (max - min) + min;
    
    const drawRoundRect = (ctx, x, y, w, h, r) => {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    };

    const drawJellyBlock = (ctx, x, y, size, color1, color2, icon, imageUrl) => {
        const r = size * 0.25;
        ctx.save();
        ctx.translate(x, y);

        // 1. Shadow
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        drawRoundRect(ctx, 0, 10, size, size, r); ctx.fill();

        // 2. Main Block Body
        const grd = ctx.createLinearGradient(0, 0, 0, size);
        grd.addColorStop(0, color1); grd.addColorStop(1, color2);
        drawRoundRect(ctx, 0, 0, size, size, r);
        ctx.fillStyle = grd; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.stroke();

        // 3. Image or Emoji Icon
        const imgObj = getLoadedImage(imageUrl);
        if (imgObj && imgObj.complete && imgObj.naturalWidth > 0) {
            ctx.save();
            const pad = size * 0.035;
            const imgSize = size * 0.93;
            drawRoundRect(ctx, pad, pad, imgSize, imgSize, r * 0.85);
            ctx.clip();
            ctx.drawImage(imgObj, pad, pad, imgSize, imgSize);
            ctx.restore();
        } else {
            ctx.font = `bold ${size*0.45}px sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 5; ctx.shadowOffsetY = 3;
            ctx.fillText(icon || "📦", size/2, size/2 + size*0.05);
        }

        ctx.restore();
    };

    const drawVacuumTube = (ctx, x, y, width, height, data, state) => {
        ctx.save();
        const topY = y; const botY = y + height;
        const rx = width / 2; const ry = width * 0.15;
        
        const baseGrd = ctx.createLinearGradient(x - rx, 0, x + rx, 0);
        baseGrd.addColorStop(0, "#475569"); baseGrd.addColorStop(0.5, "#94a3b8"); baseGrd.addColorStop(1, "#334155");
        
        ctx.fillStyle = baseGrd;
        ctx.beginPath(); ctx.ellipse(x, botY, rx*1.1, ry*1.1, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(x - rx*1.1, botY - 15, rx*2.2, 15);
        ctx.beginPath(); ctx.ellipse(x, botY - 15, rx*1.1, ry*1.1, 0, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = "rgba(15, 23, 42, 0.7)";
        ctx.fillRect(x - rx, topY, rx*2, height - 15);

        ctx.fillStyle = "#020617";
        ctx.beginPath(); ctx.ellipse(x, botY - 15, rx, ry, 0, 0, Math.PI*2); ctx.fill();

        let glowColor = "rgba(56, 189, 248, 0.1)";
        let ringColor = "#38bdf8";
        if (state === 'success') { glowColor = "rgba(74, 222, 128, 0.3)"; ringColor = "#4ade80"; }
        if (state === 'error') { glowColor = "rgba(248, 113, 113, 0.3)"; ringColor = "#f87171"; }

        if (state !== 'error') {
            const beamGrd = ctx.createLinearGradient(0, topY - 150, 0, topY);
            beamGrd.addColorStop(0, "transparent"); beamGrd.addColorStop(1, glowColor);
            ctx.fillStyle = beamGrd;
            ctx.beginPath();
            ctx.moveTo(x - rx*0.8, topY - 150); ctx.lineTo(x + rx*0.8, topY - 150);
            ctx.lineTo(x + rx, topY); ctx.lineTo(x - rx, topY); ctx.fill();
        }

        const glassGrd = ctx.createLinearGradient(x - rx, 0, x + rx, 0);
        glassGrd.addColorStop(0, "rgba(255,255,255,0.1)");
        glassGrd.addColorStop(0.2, "rgba(255,255,255,0.3)");
        glassGrd.addColorStop(0.5, "transparent");
        glassGrd.addColorStop(0.9, "rgba(255,255,255,0.1)");
        ctx.fillStyle = glassGrd;
        ctx.fillRect(x - rx, topY, rx*2, height - 15);
        ctx.beginPath(); ctx.ellipse(x, botY - 15, rx, ry, 0, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = baseGrd;
        ctx.fillRect(x - rx*1.1, topY - 10, rx*2.2, 10);
        ctx.beginPath(); ctx.ellipse(x, topY, rx*1.1, ry*1.1, 0, 0, Math.PI*2); ctx.fill();
        
        ctx.beginPath(); ctx.ellipse(x, topY - 10, rx*1.1, ry*1.1, 0, 0, Math.PI*2);
        ctx.fillStyle = ringColor; ctx.fill();
        ctx.shadowColor = ringColor; ctx.shadowBlur = 15;
        ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.beginPath(); ctx.ellipse(x, topY - 10, rx*0.9, ry*0.9, 0, 0, Math.PI*2);
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fill();

        // 6. Bảng hiển thị Hologram lơ lửng phía trước ống (Thu nhỏ lại)
        const holoY = topY + height * 0.4;
        const boxWidth = Math.max(120, rx * 1.5);
        const boxHeight = 42;
        
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.strokeStyle = ringColor; ctx.lineWidth = 2;
        drawRoundRect(ctx, x - boxWidth / 2, holoY - boxHeight / 2, boxWidth, boxHeight, 10);
        ctx.fill(); ctx.stroke();

        ctx.font = "bold 15px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(data.text || "", x, holoY);

        ctx.restore();
    };

    class Particle {
        constructor(x, y, color, type) {
            this.x = x; this.y = y; this.color = color; this.type = type;
            this.life = 1.0;
            if (type === 'star') {
                this.size = rand(10, 20); this.vx = rand(-10, 10); this.vy = rand(-15, -5);
                this.decay = rand(0.015, 0.03); this.gravity = 0.5;
            } else if (type === 'smoke') {
                this.size = rand(20, 40); this.vx = rand(-5, 5); this.vy = rand(-8, -2);
                this.decay = rand(0.02, 0.05); this.gravity = -0.2;
            }
            this.angle = rand(0, Math.PI * 2); this.rotSpeed = rand(-0.2, 0.2);
        }
        update() {
            this.x += this.vx; this.y += this.vy; this.vy += this.gravity;
            this.angle += this.rotSpeed;
            if (this.type === 'smoke') this.size += 0.8;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
            ctx.globalAlpha = Math.max(0, this.life);
            if (this.type === 'star') {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*this.size, -Math.sin((18+i*72)*Math.PI/180)*this.size);
                    ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*(this.size/2), -Math.sin((54+i*72)*Math.PI/180)*(this.size/2));
                }
                ctx.closePath(); ctx.fill();
            } else {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }
    }

    class FloatingText {
        constructor(x, y, text, color, isBig = false) {
            this.x = x; this.y = y; this.text = text; this.color = color;
            this.life = 1.0; this.vy = -3; this.isBig = isBig; this.scale = 0.5;
        }
        update() {
            this.y += this.vy; this.life -= 0.02;
            if (this.scale < 1.2) this.scale += 0.15;
            else if (this.scale > 1) this.scale -= 0.05;
        }
        draw(ctx) {
            ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.scale, this.scale);
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.font = this.isBig ? "900 36px Orbitron" : "900 28px Nunito";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.lineWidth = 6; ctx.strokeStyle = "#000"; ctx.strokeText(this.text, 0, 0);
            ctx.fillStyle = this.color; ctx.fillText(this.text, 0, 0);
            ctx.restore();
        }
    }

    class Tube {
        constructor(x, y, width, data) {
            this.x = x; this.y = y; this.w = width; this.h = 160;
            this.data = data; this.bounceY = 0;
            this.state = 'idle'; this.stateTimer = 0;
        }
        update() {
            if (this.bounceY !== 0) {
                this.bounceY += (0 - this.bounceY) * 0.2;
                if (Math.abs(this.bounceY) < 0.5) this.bounceY = 0;
            }
            if (this.stateTimer > 0) {
                this.stateTimer--;
                if (this.stateTimer <= 0) this.state = 'idle';
            }
        }
        draw(ctx) {
            drawVacuumTube(ctx, this.x, this.y + this.bounceY, this.w, this.h, this.data, this.state);
        }
        trigger(type) {
            this.state = type; this.stateTimer = 40;
            if (type === 'success') this.bounceY = 25;
            else if (type === 'error') this.bounceY = -15;
        }
    }

    class Block {
        constructor(data, startX, startY) {
            this.data = data; this.size = cw < 600 ? 110 : 150;
            this.x = startX; this.y = startY; this.baseY = startY;
            this.baseSpeed = (cw > 800) ? 2.0 : 1.6;
            this.maxSpeed = (cw > 800) ? 5.0 : 4.0;
            this.currentSpeed = this.baseSpeed;
            this.state = 'moving';
            this.vx = 0; this.vy = 0; this.gravity = 0.6;
            this.bobAngle = rand(0, Math.PI*2);
        }
        update() {
            if (this.state === 'moving') {
                const progress = Math.max(0, Math.min(1, (this.x - (-150)) / (cw + 250)));
                this.currentSpeed = this.baseSpeed + (this.maxSpeed - this.baseSpeed) * progress;
                this.x += this.currentSpeed;
                this.bobAngle += 0.1;
                this.y = this.baseY + Math.sin(this.bobAngle) * 3 - this.size;
                if (this.x > cw + 100) {
                    this.state = 'offscreen';
                }
            } else if (this.state === 'falling') {
                this.vy += this.gravity; this.y += this.vy;
                if (this.targetTube) {
                    const targetX = this.targetTube.x - this.size / 2;
                    this.x += (targetX - this.x) * 0.15;
                }
            } else if (this.state === 'rejected') {
                this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
                if (this.y > ch + 100) { 
                    this.state = 'offscreen';
                }
            }
        }
        draw(ctx) {
            if (this.state === 'falling' && this.vy > 5) {
                ctx.fillStyle = "rgba(255,255,255,0.2)";
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y); ctx.lineTo(this.x + this.size - 10, this.y);
                ctx.lineTo(this.x + this.size - 20, this.y - this.vy*3); ctx.lineTo(this.x + 20, this.y - this.vy*3);
                ctx.fill();
            }
            drawJellyBlock(ctx, this.x, this.y, this.size, this.data.color1, this.data.color2, this.data.icon, this.data.imageUrl);
        }
        drop(targetTubes = []) {
            if (this.state === 'moving') {
                this.state = 'falling'; this.vy = 2; AudioSys.play('drop');
                if (targetTubes.length > 0) {
                    let nearest = null;
                    let minDist = Infinity;
                    const bx = this.x + this.size / 2;
                    
                    for (let t of targetTubes) {
                        const dist = Math.abs(t.x - bx);
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = t;
                        }
                    }
                    if (nearest && minDist < nearest.w * 1.5) {
                        this.targetTube = nearest;
                    }
                }
            }
        }
    }

    const Game = {
        state: 'start',
        score: 0, combo: 0, comboMult: 1,
        tubes: [], blocks: [], particles: [], floats: [],
        conveyorY: 350, tubeY: 0, pairs: [], beltOffset: 0,
        activePairCount: 4,
        animFrameId: null,

        ui: {
            score: document.getElementById('score'),
            combo: document.getElementById('combo-badge'),
            redFlash: document.getElementById('red-flash'), 
            startScreen: document.getElementById('start-screen'), endScreen: document.getElementById('end-screen'),
            pauseModal: document.getElementById('pause-modal'), container: document.getElementById('game-container')
        },

        init() { this.bindEvents(); this.calculateLayout(); },

        cancelLoop() {
            if (this.animFrameId) {
                cancelAnimationFrame(this.animFrameId);
                this.animFrameId = null;
            }
        },

        calculateLayout() {
            this.conveyorY = Math.min(360, Math.floor(ch * 0.35));
            this.tubeY = ch - 220;
            if (this.tubes.length > 0) {
                const spacing = cw / this.tubes.length;
                this.tubes.forEach((t, i) => { t.x = spacing * i + spacing / 2; t.y = this.tubeY; });
            }
        },

        start(fromBeginning = true) {
            AudioSys.init();
            this.cancelLoop();
            this.calculateLayout();
            if (fromBeginning) {
                currentRoundIndex = 0;
                this.score = 0;
            }
            this.state = 'playing'; this.combo = 0; this.comboMult = 1;
            this.tubes = []; this.blocks = []; this.particles = []; this.floats = [];
            
            const currentRoundCards = (GAME_ROUNDS.length > 0) ? (GAME_ROUNDS[currentRoundIndex] || GAME_ROUNDS[0]) : VOCABULARY;
            this.pairs = [...currentRoundCards].sort(() => 0.5 - Math.random());

            const titleEl = document.getElementById('topic-title');
            if (titleEl) {
                const totalRounds = GAME_ROUNDS.length || 1;
                if (totalRounds > 1) {
                    titleEl.innerText = `${rawTopicTitle} (${currentRoundIndex + 1}/${totalRounds})`;
                } else {
                    titleEl.innerText = rawTopicTitle;
                }
            }
            
            const startSc = document.getElementById('start-screen');
            if (startSc) {
                startSc.classList.remove('active');
                startSc.style.display = 'none';
                startSc.style.pointerEvents = 'none';
            }
            if (this.ui && this.ui.endScreen) this.ui.endScreen.classList.remove('active');
            if (this.ui && this.ui.pauseModal) this.ui.pauseModal.classList.remove('active');
            if (this.ui && this.ui.container) this.ui.container.classList.remove('screen-shake');
            
            this.updateUI(); 
            const count = Math.min(this.pairs.length, cw < 600 ? 3 : 4);
            this.setupLevel(count || 3);
            
            this.animFrameId = requestAnimationFrame((t) => this.loop(t));
        },

        setupLevel(numTubes) {
            this.activePairCount = numTubes;
            const activeData = [];
            for (let i = 0; i < numTubes; i++) { 
                if (this.pairs.length > 0) activeData.push(this.pairs.pop()); 
            }
            if (activeData.length === 0) { this.endGame(true); return; }

            const spacing = cw / activeData.length;
            const tubeW = Math.min(140, spacing * 0.7);
            
            activeData.forEach((data, i) => {
                const tx = spacing * i + spacing / 2;
                this.tubes.push(new Tube(tx, this.tubeY, tubeW, data));
            });

            this.spawnSingleBlock();
        },

        spawnSingleBlock() {
            if (this.tubes.length === 0) return;
            const randomTube = this.tubes[Math.floor(Math.random() * this.tubes.length)];
            const targetData = randomTube.data;
            
            const startX = -150;
            this.blocks.push(new Block(targetData, startX, this.conveyorY));
        },

        bindEvents() {
            const handleInteract = (e) => {
                if (this.state !== 'playing') return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                for (let b of this.blocks) {
                    if (b.state === 'moving' && clientX > b.x && clientX < b.x + b.size && clientY > b.y && clientY < b.y + b.size) {
                        b.drop(this.tubes); return;
                    }
                }
                for (let t of this.tubes) {
                    if (clientX > t.x - t.w/2 && clientX < t.x + t.w/2 && clientY > t.y && clientY < t.y + t.h) {
                        let best = null;
                        let minDist = Infinity;
                        for (let b of this.blocks) {
                            if (b.state === 'moving') {
                                const bx = b.x + b.size/2;
                                const dist = Math.abs(t.x - bx);
                                if (dist < t.w * 1.5 && dist < minDist) { 
                                    best = b; 
                                    minDist = dist;
                                }
                            }
                        }
                        if (best) {
                            best.drop(this.tubes);
                            best.targetTube = t;
                        }
                        return;
                    }
                }
            };
            canvas.addEventListener('mousedown', handleInteract);
            canvas.addEventListener('touchstart', handleInteract, {passive: false});

            const btnStart = document.getElementById('btn-start');
            if (btnStart) {
                const handleStart = (e) => {
                    if (e) { e.preventDefault(); e.stopPropagation(); }
                    AudioSys.init();
                    AudioSys.play('click');
                    this.start();
                };
                btnStart.addEventListener('click', handleStart);
                btnStart.addEventListener('touchstart', handleStart, { passive: false });
            }

            const nextBtn = document.getElementById('btn-next-round');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    AudioSys.play('click');
                    currentRoundIndex++;
                    this.start(false);
                });
            }

            document.getElementById('btn-restart').addEventListener('click', () => {
                AudioSys.play('click');
                currentRoundIndex = 0;
                this.start(true);
            });
            
            const soundBtn = document.getElementById('btn-sound');
            if (soundBtn) {
                soundBtn.addEventListener('click', (e) => {
                    const on = AudioSys.toggle();
                    e.target.innerHTML = on ? '🔊' : '🔇';
                    e.target.className = `btn-chunky btn-circle ${on ? 'btn-blue' : 'btn-red'}`;
                });
            }

            document.getElementById('btn-pause').addEventListener('click', () => {
                AudioSys.play('click'); this.state = 'paused'; this.ui.pauseModal.classList.add('active');
            });
            document.getElementById('btn-resume').addEventListener('click', () => {
                AudioSys.play('click'); this.state = 'playing'; this.ui.pauseModal.classList.remove('active');
                this.cancelLoop();
                this.animFrameId = requestAnimationFrame(t => this.loop(t));
            });
            document.getElementById('btn-quit').addEventListener('click', () => {
                AudioSys.play('click'); this.state = 'start';
                this.ui.pauseModal.classList.remove('active');
                this.ui.startScreen.classList.add('active');
            });
        },

        checkCollisions() {
            for (let i = this.blocks.length - 1; i >= 0; i--) {
                const b = this.blocks[i];
                if (b.state === 'falling') {
                    const bY = b.y + b.size; const tY = this.tubeY + 10;
                    if (bY > tY) {
                        let hit = null; const bx = b.x + b.size/2;
                        for (let t of this.tubes) {
                            if (bx > t.x - t.w/2 && bx < t.x + t.w/2) { hit = t; break; }
                        }
                        if (hit) {
                            if (hit.data.id === b.data.id) this.handleCorrect(b, hit, i);
                            else this.handleWrong(b, hit);
                        } else {
                            this.handleWrong(b, null);
                        }
                    }
                }
            }
        },

        handleCorrect(b, t, i) {
            AudioSys.play('correct'); t.trigger('success');
            if (b.data.audioUrl) {
                AudioSys.playAudioUrl(b.data.audioUrl);
            } else if (b.data.text) {
                AudioSys.speak(b.data.text);
            }

            for(let p=0; p<25; p++) this.particles.push(new Particle(t.x, t.y, b.data.color1, 'star'));

            this.combo++; let cText = "";
            if (this.combo >= 6) { this.comboMult = 3; cText = "SUPER COMBO!"; AudioSys.play('combo'); }
            else if (this.combo >= 3) { this.comboMult = 2; cText = "COMBO x2!"; AudioSys.play('combo'); }

            const pts = 10 * this.comboMult; this.score += pts; this.updateUI();
            this.floats.push(new FloatingText(t.x, t.y - 40, `+${pts}`, "#4ade80", false));
            if (cText) this.floats.push(new FloatingText(t.x, t.y - 80, cText, "#fde047", true));

            this.blocks.splice(i, 1);
            
            const tIdx = this.tubes.indexOf(t);
            if (tIdx > -1) {
                this.tubes.splice(tIdx, 1);
                if (this.pairs.length > 0) {
                    const newP = this.pairs.pop();
                    this.tubes.splice(tIdx, 0, new Tube(t.x, this.tubeY, t.w, newP));
                }
            }

            if (this.tubes.length > 0) {
                setTimeout(() => { if(this.state === 'playing') this.spawnSingleBlock(); }, 500);
            } else {
                setTimeout(() => this.endGame(true), 800);
            }
        },

        handleWrong(b, t) {
            AudioSys.play('wrong'); if (t) t.trigger('error');
            this.ui.redFlash.classList.add('active'); this.ui.container.classList.add('screen-shake');
            setTimeout(() => { this.ui.redFlash.classList.remove('active'); this.ui.container.classList.remove('screen-shake'); }, 300);

            const px = b.x + b.size/2; const py = b.y + b.size;
            for(let p=0; p<12; p++) this.particles.push(new Particle(px, py, '#475569', 'smoke'));

            this.score = Math.max(0, this.score - 5); this.combo = 0; this.comboMult = 1; this.updateUI();
            this.floats.push(new FloatingText(px, py - 40, "-5", "#f87171", false));

            b.state = 'rejected'; b.vy = -12; b.vx = (px > cw/2) ? 8 : -8;
        },

        updateUI() {
            this.ui.score.innerText = this.score.toString().padStart(4, '0');
            if (this.comboMult > 1) {
                this.ui.combo.classList.remove('hidden');
                this.ui.combo.innerText = `x${this.comboMult} COMBO`;
            } else this.ui.combo.classList.add('hidden');
        },

        endGame(isWin) {
            this.state = 'over';
            const tEl = document.getElementById('end-title');
            const msgEl = document.getElementById('end-message');
            const nextBtn = document.getElementById('btn-next-round');
            const totalRounds = GAME_ROUNDS.length || 1;

            if (isWin) {
                AudioSys.play('win');
                if (currentRoundIndex + 1 < totalRounds) {
                    tEl.innerText = `HOÀN THÀNH VÒNG ${currentRoundIndex + 1}/${totalRounds}`;
                    tEl.className = "text-3xl font-black text-green-400 mb-2 drop-shadow-lg";
                    if (msgEl) msgEl.innerText = `Bạn đã thu thập xong đồ chơi vòng ${currentRoundIndex + 1}! Sẵn sàng sang vòng ${currentRoundIndex + 2}!`;
                    if (nextBtn) {
                        nextBtn.innerText = `▶ TIẾP TỤC VÒNG ${currentRoundIndex + 2}`;
                        nextBtn.classList.remove('hidden');
                    }
                } else {
                    tEl.innerText = "HOÀN THÀNH TẤT CẢ VÒNG!";
                    tEl.className = "text-3xl font-black text-yellow-400 mb-2 drop-shadow-lg";
                    if (msgEl) msgEl.innerText = "Chúc mừng bạn đã hoàn thành toàn bộ bài tập!";
                    if (nextBtn) {
                        nextBtn.classList.add('hidden');
                    }
                }
            }
            document.getElementById('final-score').innerText = this.score.toString().padStart(4, '0');
            this.ui.endScreen.classList.add('active');
        },

        drawConveyor() {
            let activeSpeed = (cw > 800) ? 2.0 : 1.6;
            const movingBlock = this.blocks.find(b => b.state === 'moving');
            if (movingBlock && movingBlock.currentSpeed) {
                activeSpeed = movingBlock.currentSpeed;
            }
            this.beltOffset = (this.beltOffset + activeSpeed) % 60;
            const y = this.conveyorY;
            
            ctx.fillStyle = "#1e293b"; ctx.fillRect(0, y, cw, 60);

            for (let i = -60; i < cw + 60; i += 60) {
                const px = i + this.beltOffset;
                ctx.fillStyle = "#64748b";
                drawRoundRect(ctx, px + 2, y, 56, 50, 8); ctx.fill();
                const plGrd = ctx.createLinearGradient(0, y, 0, y+50);
                plGrd.addColorStop(0, "rgba(255,255,255,0.2)"); plGrd.addColorStop(0.5, "transparent"); plGrd.addColorStop(1, "rgba(0,0,0,0.4)");
                ctx.fillStyle = plGrd; drawRoundRect(ctx, px + 2, y, 56, 50, 8); ctx.fill();
                ctx.fillStyle = "#334155"; ctx.fillRect(px + 54, y + 15, 6, 20);
                ctx.fillStyle = "#cbd5e1";
                ctx.beginPath(); ctx.arc(px + 10, y + 10, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + 10, y + 40, 3, 0, Math.PI*2); ctx.fill();
            }

            const railGrd = ctx.createLinearGradient(0, y+50, 0, y+65);
            railGrd.addColorStop(0, "#e2e8f0"); railGrd.addColorStop(1, "#94a3b8");
            ctx.fillStyle = railGrd; ctx.fillRect(0, y+50, cw, 15);
            ctx.fillStyle = "rgba(239, 68, 68, 0.8)";
            for(let i = -100; i < cw+100; i += 80) {
                ctx.beginPath(); ctx.moveTo(i, y+50); ctx.lineTo(i+20, y+50);
                ctx.lineTo(i+10, y+65); ctx.lineTo(i-10, y+65); ctx.fill();
            }
        },

        loop(ts) {
            if (this.state !== 'playing') return;
            ctx.clearRect(0, 0, cw, ch);

            this.drawConveyor();
            this.tubes.forEach(t => { t.update(); t.draw(ctx); });
            
            for (let i = this.blocks.length - 1; i >= 0; i--) {
                let b = this.blocks[i];
                b.update(); 
                if (b.state === 'offscreen') {
                    this.blocks.splice(i, 1);
                    setTimeout(() => { if(this.state === 'playing') this.spawnSingleBlock(); }, 200);
                } else {
                    b.draw(ctx);
                }
            }

            for (let i = this.particles.length - 1; i >= 0; i--) {
                let p = this.particles[i]; p.update(); p.draw(ctx);
                if (p.life <= 0) this.particles.splice(i, 1);
            }
            for (let i = this.floats.length - 1; i >= 0; i--) {
                let f = this.floats[i]; f.update(); f.draw(ctx);
                if (f.life <= 0) this.floats.splice(i, 1);
            }

            this.checkCollisions();
            this.animFrameId = requestAnimationFrame((t) => this.loop(t));
        }
    };
    Game.calculateLayout();

    let GAME_ROUNDS = [];
    let currentRoundIndex = 0;
    let rawTopicTitle = "Băng Chuyền Thả Khối";
    let isDataReady = false;
    let isStartClicked = false;

    function applyTopicData(data) {
        if (!data || !data.success || !data.cards || data.cards.length === 0) return;
        if (data.topicName) {
            rawTopicTitle = data.topicName;
        }

        const formattedCards = data.cards.map((c, i) => {
            const item = {
                id: c.id || (i + 1),
                text: c.word || "",
                imageUrl: c.imageUrl || null,
                audioUrl: c.audioUrl || null,
                roundIndex: (c.roundIndex !== undefined && c.roundIndex !== null) ? c.roundIndex : 0,
                icon: "📦",
                color1: COLOR_PALETTES[i % COLOR_PALETTES.length].color1,
                color2: COLOR_PALETTES[i % COLOR_PALETTES.length].color2
            };
            if (item.imageUrl) {
                getLoadedImage(item.imageUrl);
            }
            return item;
        });

        const roundMap = {};
        let hasMultiRounds = false;

        formattedCards.forEach((c) => {
            const rIdx = c.roundIndex || 0;
            if (rIdx > 0) hasMultiRounds = true;
            if (!roundMap[rIdx]) roundMap[rIdx] = [];
            roundMap[rIdx].push(c);
        });

        if (hasMultiRounds && Object.keys(roundMap).length > 0) {
            GAME_ROUNDS = Object.keys(roundMap)
                .sort((a, b) => Number(a) - Number(b))
                .map(k => roundMap[k]);
        } else {
            GAME_ROUNDS = [];
            const chunkSize = 15;
            for (let i = 0; i < formattedCards.length; i += chunkSize) {
                GAME_ROUNDS.push(formattedCards.slice(i, i + chunkSize));
            }
        }

        currentRoundIndex = 0;
        isDataReady = true;

        const btn = document.getElementById('btn-start');
        if (btn) {
            btn.innerHTML = '▶ PLAY';
            btn.style.opacity = '1';
        }

        if (isStartClicked && Game && Game.state !== 'playing' && Game.start) {
            Game.start(true);
        }
    }

    // Listen for preloaded data sent from parent Next.js page
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'INIT_GAME_DATA' && event.data.topicData) {
            applyTopicData(event.data.topicData);
        }
    });

    window.handleGlobalStartPlay = function(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        isStartClicked = true;
        AudioSys.init();
        AudioSys.play('click');

        const btn = document.getElementById('btn-start');

        if (!isDataReady) {
            if (btn) btn.innerHTML = '⌛ ĐANG TẢI...';
            return;
        }

        const screen = document.getElementById('start-screen');
        if (screen) {
            screen.classList.remove('active');
            screen.style.display = 'none';
            screen.style.pointerEvents = 'none';
        }
        if (Game && Game.state !== 'playing' && Game.start) {
            Game.start();
        }
    };

    window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const topicId = urlParams.get('topicId');

        if (topicId && !isDataReady) {
            try {
                const res = await fetch(`/api/games/flashcard-match/${topicId}`);
                const data = await res.json();
                applyTopicData(data);
            } catch(e) {
                console.warn("Could not fetch topic cards, using default vocabulary:", e);
            }
        }

        Game.init();
        if (isStartClicked && isDataReady && Game.state !== 'playing') {
            Game.start();
        }
    };
</script>

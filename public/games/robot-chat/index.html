<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Robot Chat — English Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f0c1a; --card: #1a1630; --card2: #231e3d; --border: #312c55;
    --accent: #7c5cfc; --accent2: #a78bfa; --teal: #22d3ee; --green: #4ade80;
    --yellow: #fbbf24; --red: #f87171; --text: #e8e3ff; --muted: #8b83b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star { position: absolute; border-radius: 50%; background: white; animation: twinkle var(--d) ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.1} 50%{opacity:.7} }

  .screen { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .screen.hidden { display: none; }
  #screenGame { height: 100vh; height: 100dvh; min-height: 0; padding: 16px 24px; justify-content: flex-start; overflow: hidden; }

  /* ── WELCOME ── */
  .welcome-title { font-size: clamp(2rem,5vw,3.2rem); font-weight:900; text-align:center; margin-bottom:8px;
    background: linear-gradient(135deg,var(--accent2),var(--teal)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .welcome-sub { color:var(--muted); text-align:center; font-size:1.1rem; margin-bottom:40px; }
  .section-label { font-size:.8rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .level-grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:36px; }
  .level-btn { padding:10px 22px; border-radius:100px; border:2px solid var(--border); background:var(--card2);
    color:var(--text); font-family:inherit; font-size:.95rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .level-btn:hover { border-color:var(--accent2); transform:translateY(-2px); }
  .level-btn.active { border-color:var(--accent); background:var(--accent); color:white; box-shadow:0 0 20px var(--accent)55; }
  .topic-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; max-width:700px; width:100%; }
  .topic-card { background:var(--card); border:2px solid var(--border); border-radius:20px; padding:20px 12px;
    text-align:center; cursor:pointer; transition:all .25s; }
  .topic-card:hover { border-color:var(--accent2); transform:translateY(-3px); box-shadow:0 8px 24px #7c5cfc33; }
  .topic-card .icon { font-size:2.4rem; margin-bottom:8px; }
  .topic-card .name { font-size:.9rem; font-weight:800; }

  /* ── GAME LAYOUT ── */
  .game-wrap { width:100%; max-width:820px; height:100%; display:flex; flex-direction:column; align-items:center; overflow:hidden; }
  .game-main-content { width: 100%; display: flex; flex-direction: row; align-items: center; gap: 24px; flex: 1; min-height: 0; margin-bottom: 16px; padding: 0 20px; }
  .game-header { width:100%; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .game-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .badge { padding:5px 14px; border-radius:100px; font-size:.8rem; font-weight:800; letter-spacing:.05em; }
  .badge-topic { background:#7c5cfc22; border:1.5px solid var(--accent); color:var(--accent2); }
  .badge-level { background:#22d3ee22; border:1.5px solid var(--teal); color:var(--teal); }
  .btn-new { padding:7px 16px; border-radius:100px; border:1.5px solid var(--border); background:transparent;
    color:var(--muted); font-family:inherit; font-size:.85rem; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn-new:hover { border-color:var(--red); color:var(--red); }

  /* ── ROBOT ── */
  .robot-wrap { position:relative; width:90px; height:90px; flex-shrink: 0; margin: 14px; }
  #robotSvg { width:100%; height:100%; filter:drop-shadow(0 0 20px #7c5cfc66); }
  .robot-ring { position:absolute; inset:-14px; border-radius:50%; border:2px solid transparent;
    background:linear-gradient(var(--bg),var(--bg)) padding-box, linear-gradient(135deg,var(--accent),var(--teal)) border-box;
    animation:ringPulse 2.5s ease-in-out infinite; }
  @keyframes ringPulse { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:.8;transform:scale(1.04)} }

  /* Robot state animations */
  .robot-idle #robotBody { animation:bodyBounce 2.5s ease-in-out infinite; transform-origin:center bottom; }
  @keyframes bodyBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .robot-idle #eyeL,.robot-idle #eyeR { animation:blink 3.5s ease-in-out infinite; transform-origin:center; }
  @keyframes blink { 0%,93%,100%{transform:scaleY(1)} 95%{transform:scaleY(.05)} }
  .robot-speaking #robotBody { animation:speakBounce .4s ease-in-out infinite alternate; transform-origin:center bottom; }
  @keyframes speakBounce { from{transform:translateY(0)} to{transform:translateY(-4px)} }
  .robot-speaking #mouth { animation:mouthTalk .22s ease-in-out infinite alternate; transform-origin:center; }
  @keyframes mouthTalk { from{transform:scaleY(.15)} to{transform:scaleY(1)} }
  .robot-speaking .robot-ring { animation:ringPulse .55s ease-in-out infinite; }
  .robot-thinking #eyeL,.robot-thinking #eyeR { animation:thinkEye 1s ease-in-out infinite; }
  @keyframes thinkEye { 0%,100%{transform:translateX(0)} 50%{transform:translateX(3px)} }
  .robot-thinking #antenna-ball { animation:antBlink .5s ease-in-out infinite alternate; }
  @keyframes antBlink { from{fill:#7c5cfc} to{fill:#22d3ee} }

  /* ── CHAT AREA ── */
  .chat-area { display:flex; flex-direction:column; gap:10px; min-height:80px; flex:1; overflow-y:auto; padding-right:6px; padding-bottom: 24px; scrollbar-width: none; -ms-overflow-style: none; }
  .chat-area::-webkit-scrollbar { display: none; }

  /* Robot bubble */
  .robot-bubble { background:var(--card); border:2px solid var(--border); border-radius:18px 18px 18px 4px;
    padding:14px 18px; font-size:1.1rem; font-weight:700; line-height:1.5;
    animation:bubblePop .3s cubic-bezier(.17,.67,.35,1.3); align-self:flex-start; max-width:90%; }
  @keyframes bubblePop { from{opacity:0;transform:scale(.9) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .typing-dots span { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent2);
    margin:0 3px; animation:dot 1.2s ease-in-out infinite; }
  .typing-dots span:nth-child(2){animation-delay:.2s} .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes dot { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1);opacity:1} }

  /* Student bubble */
  .student-bubble { background:#1a3a2a; border:2px solid #4ade8066; border-radius:18px 18px 4px 18px;
    padding:12px 18px; font-size:1rem; font-weight:700; line-height:1.5; color:#86efac;
    align-self:flex-end; max-width:90%; animation:bubblePop .25s ease; }
  .student-bubble .label { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:#4ade8088; margin-bottom:3px; }

  /* ── HINT CARD & TEMPLATE BLANK ── */
  .hint-section { width:100%; margin-bottom:14px; }
  .hint-label { font-size:.75rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; text-align:center; }
  .hint-card { width:100%; max-width:760px; margin:0 auto; padding:14px 20px; border-radius:20px; border:2px dashed var(--accent); background:#7c5cfc12; text-align:center; box-shadow:0 4px 20px #7c5cfc1a; transition:filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease; display:flex; align-items:center; justify-content:center; gap:12px; position:relative; }
  .hint-card.blurred { filter:blur(10px); opacity:0.35; transform:scale(0.98); }
  .hint-card.blurred .hint-tokens { pointer-events:none; user-select:none; }
  .hint-tokens { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 10px; font-size:1.2rem; font-weight:800; line-height:1.6; min-height:44px; flex:1; }
  .btn-undo-hint { padding:6px 14px; border-radius:100px; border:1.5px solid var(--border); background:var(--card2); color:var(--muted); font-family:inherit; font-size:0.82rem; font-weight:800; display:inline-flex; align-items:center; gap:6px; cursor:pointer; transition:all .2s; flex-shrink:0; position:relative; z-index:30; pointer-events:auto !important; }
  .btn-undo-hint:hover { border-color:var(--yellow); color:var(--yellow); background:#fbbf2415; transform:scale(1.06); box-shadow:0 0 14px #fbbf2444; }
  .btn-change-hint { padding:6px 14px; border-radius:100px; border:1.5px solid var(--accent); background:rgba(124, 92, 252, 0.15); color:var(--accent2); font-family:inherit; font-size:0.82rem; font-weight:800; display:inline-flex; align-items:center; gap:6px; cursor:pointer; transition:all .2s; flex-shrink:0; position:relative; z-index:30; pointer-events:auto !important; }
  .btn-change-hint:hover { border-color:#a78bfa; color:#ffffff; background:var(--accent); transform:scale(1.06); box-shadow:0 0 14px #7c5cfc55; }
  .token-word { padding:4px 10px; border-radius:10px; color:var(--accent2); transition:all 0.22s cubic-bezier(.17,.67,.35,1.3); }
  .token-word.read { background:var(--yellow); color:#0f0c1a; font-weight:900; box-shadow:0 0 16px #fbbf24aa; transform:scale(1.06); }
  .token-blank { padding:4px 16px; border-radius:12px; border:2px dashed var(--yellow); background:#fbbf241a; color:var(--yellow); font-weight:900; min-width:70px; text-align:center; display:inline-flex; align-items:center; justify-content:center; transition:all 0.22s cubic-bezier(.17,.67,.35,1.3); animation:blankPulse 2s ease-in-out infinite; }
  @keyframes blankPulse { 0%,100%{border-color:var(--yellow);box-shadow:0 0 4px #fbbf2444} 50%{border-color:#f59e0b;box-shadow:0 0 14px #fbbf24aa} }
  .token-blank.filled { background:var(--yellow); color:#0f0c1a; border:2px solid var(--yellow); box-shadow:0 0 20px #fbbf24cc; animation:none; transform:scale(1.08); font-weight:900; }


  /* ── MIC / DONE ── */
  .mic-section { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:12px; }

  /* Mic icon (small, decorative when listening) */
  .mic-icon { width:44px; height:44px; border-radius:50%; background:var(--card2); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform 0.2s, border-color 0.2s; }
  .mic-icon:hover { border-color:var(--accent2); transform:scale(1.06); }
  .mic-icon svg { width:20px; height:20px; fill:var(--muted); }
  .mic-icon.active { background:#f8717122; border-color:var(--red); animation:micPulse .8s ease-in-out infinite; }
  .mic-icon.active svg { fill:var(--red); }
  @keyframes micPulse { 0%{box-shadow:0 0 0 0 #f8717166} 70%{box-shadow:0 0 0 16px #f8717100} 100%{box-shadow:0 0 0 0 #f8717100} }

  /* ── WAVEFORM RECORDING INDICATOR ── */
  .waveform-bars { display:none; align-items:center; justify-content:center; gap:5px;
    width:56px; height:44px; }
  .waveform-bars.active { display:flex; }
  .waveform-bars span { display:block; width:4px; border-radius:4px; background:var(--red);
    height:4px;
    animation: waveBar 0s ease-in-out infinite alternate;
    animation-play-state: paused; }
  .waveform-bars.active span { animation-duration: 0.6s; animation-play-state: running; }
  .waveform-bars span:nth-child(1){animation-delay:0s;}
  .waveform-bars span:nth-child(2){animation-delay:0.1s;}
  .waveform-bars span:nth-child(3){animation-delay:0.2s;}
  .waveform-bars span:nth-child(4){animation-delay:0.3s;}
  .waveform-bars span:nth-child(5){animation-delay:0.4s;}
  @keyframes waveBar {
    0%   { height: 4px; opacity: 0.5; }
    50%  { height: 28px; opacity: 1; }
    100% { height: 4px; opacity: 0.5; }
  }

  .mic-row { display: flex; align-items: center; justify-content: center; gap: 16px; position: relative; }

  /* Done button */
  .done-btn { padding:0 28px; border-radius:100px; border:none; background:var(--green); color:#0a1f12;
    font-family:inherit; font-size:1rem; font-weight:900; cursor:pointer; transition:all .2s;
    animation:donePop .3s cubic-bezier(.17,.67,.35,1.3); letter-spacing:.03em; height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .done-btn:hover { transform:scale(1.06); box-shadow:0 8px 28px #4ade8055; }
  @keyframes donePop { from{opacity:0;transform:scale(.75)} to{opacity:1;transform:scale(1)} }
  .done-btn.hidden { display:none !important; }

  /* live transcript */
  .live-text-wrap { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 24px; max-width: 500px; margin: 0 auto; }
  .live-text { font-size:1rem; font-weight:700; color:var(--teal); font-style:italic; padding:0 4px; text-align: center; }
  .btn-clear-text { background: transparent; border: none; color: var(--red); opacity: 0.7; cursor: pointer; display: none; align-items: center; justify-content: center; padding: 4px; border-radius: 50%; transition: all 0.25s; vertical-align: middle; }
  .btn-clear-text:hover { opacity: 1; background: rgba(248, 113, 113, 0.15); transform: rotate(-45deg); }
  .btn-clear-text svg { display: block; }

  /* Confirm panel */
  .confirm-wrap { display: flex; align-items: center; justify-content: center; padding: 10px 16px;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 16px; max-width: 480px; margin: 0 auto 8px;
    animation: fadeInUp .25s ease; }
  .confirm-wrap.hidden { display: none !important; }
  .confirm-inline { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .confirm-text { font-size: 1.05rem; font-weight: 700; color: #fff; line-height: 1.4; }
  .confirm-icon-btn { width: 32px; height: 32px; border-radius: 50%; border: none; display: inline-flex;
    align-items: center; justify-content: center; cursor: pointer; transition: all .2s; flex-shrink: 0; }
  .rerecord-btn { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
  .rerecord-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.1) rotate(-20deg); }
  .submit-btn { background: var(--green); color: #0a1f12; }
  .submit-btn:hover { transform: scale(1.15); box-shadow: 0 6px 20px #4ade8066; }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }

  .mic-status { display: none !important; }

  /* Turn info */
  .turn-info { display: none !important; }

  /* Toast */
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a1630;
    border:1.5px solid var(--red); color:var(--red); padding:10px 20px; border-radius:12px;
    font-size:.9rem; font-weight:700; z-index:999; animation:toastIn .3s ease; }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* no-speech banner */
  .nospeech-banner { background:#231e3d; border:1.5px solid var(--yellow); border-radius:14px;
    padding:12px 16px; font-size:.85rem; color:var(--yellow); font-weight:700; text-align:center;
    margin-bottom:12px; display:none; }

  @media(max-width:480px){
    #screenGame { padding: 12px 16px; }
    .game-main-content { flex-direction: column; gap: 12px; margin-bottom: 12px; padding: 0 8px; }
    .robot-wrap { width:70px; height:70px; margin: 14px; }
    .robot-bubble { font-size:1rem; padding: 10px 14px; }
    .student-bubble { font-size:0.95rem; padding: 10px 14px; }
    .game-header { margin-bottom: 12px; }
    .chat-area { margin-bottom: 0px; }
    .mic-section { gap: 6px; margin-bottom: 4px; }
    .done-btn { padding: 0 24px; font-size: 0.95rem; height: 38px; }
  }

  /* Switch Toggle Styles */
  .toggle-translate { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .toggle-translate input { display: none; }
  .toggle-slider { position: relative; width: 34px; height: 18px; background: var(--border); border-radius: 100px; transition: all 0.3s; }
  .toggle-slider::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--muted); border-radius: 50%; transition: all 0.3s; }
  .toggle-translate input:checked + .toggle-slider { background: var(--green); }
  .toggle-translate input:checked + .toggle-slider::after { left: 18px; background: #0a1f12; }
  .toggle-text { font-size: 0.72rem; font-weight: 800; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; transition: color 0.3s; }
  .toggle-translate input:checked ~ .toggle-text { color: var(--text); }

  /* Speed Select Styles */
  .speed-select { background: var(--card2); border: 1.5px solid var(--border); color: var(--text); font-family: inherit; font-size: 0.72rem; font-weight: 800; padding: 4px 10px; border-radius: 100px; cursor: pointer; outline: none; transition: all 0.25s; text-transform: uppercase; letter-spacing: 0.05em; }
  .speed-select:hover { border-color: var(--accent2); }
  .speed-select option { background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- ══ WELCOME ══ -->
<div class="screen" id="screenWelcome">
  <div style="max-width:480px;width:100%;text-align:center">
    <div class="welcome-title">Chat with ROBO 🤖</div>
    <div class="welcome-sub" id="welcomeSub">Press start and <b>speak</b> your answers!</div>
    <button class="done-btn" id="btnStart" style="margin-top:32px;padding:0 48px;height:52px;font-size:1.1rem">▶ Start Chatting</button>
  </div>
</div>

<!-- ══ GAME ══ -->
<div class="screen hidden" id="screenGame">
  <div class="game-wrap">

    <!-- Header -->
    <div class="game-header">
      <div class="game-meta">
        <span class="badge badge-level" id="badgeLevel"></span>
      </div>
      <div style="display: flex; gap: 16px; align-items: center;">
        <label class="toggle-translate" id="toggleTranslateLabel">
          <input type="checkbox" id="toggleTranslate">
          <span class="toggle-slider"></span>
          <span class="toggle-text" id="toggleTranslateText">Translate</span>
        </label>
        
        <div class="speed-control" style="display: none !important;">
          <select id="speedSelect" class="speed-select" title="Speech Speed">
            <option value="0.75">🐢 0.75x</option>
            <option value="0.85">🤖 0.85x</option>
            <option value="0.95">⚡ 0.95x</option>
          </select>
        </div>

        <button class="btn-new" id="btnNew" style="display: none !important;">↩ Restart</button>
      </div>
    </div>

    <!-- Game main content (Robot on left, Chat on right) -->
    <div class="game-main-content">
      <!-- Robot avatar -->
      <div class="robot-wrap">
        <div class="robot-ring"></div>
        <svg id="robotSvg" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="robotBody">
            <rect x="96" y="4" width="8" height="28" rx="4" fill="#5b4db3"/>
            <circle id="antenna-ball" cx="100" cy="4" r="8" fill="#7c5cfc"/>
            <rect x="30" y="32" width="140" height="100" rx="28" fill="#231e3d" stroke="#4c4280" stroke-width="2.5"/>
            <rect x="44" y="48" width="112" height="70" rx="16" fill="#0f0c1a" stroke="#312c55" stroke-width="1.5"/>
            <g id="eyeL"><circle cx="74" cy="78" r="14" fill="#7c5cfc" opacity=".15"/><circle cx="74" cy="78" r="9" fill="#22d3ee"/><circle cx="77" cy="75" r="3" fill="white"/></g>
            <g id="eyeR"><circle cx="126" cy="78" r="14" fill="#7c5cfc" opacity=".15"/><circle cx="126" cy="78" r="9" fill="#22d3ee"/><circle cx="129" cy="75" r="3" fill="white"/></g>
            <g id="mouth"><rect x="76" y="100" width="48" height="10" rx="5" fill="#7c5cfc" opacity=".8"/></g>
            <circle cx="30" cy="82" r="8" fill="#312c55" stroke="#4c4280" stroke-width="1.5"/>
            <circle cx="170" cy="82" r="8" fill="#312c55" stroke="#4c4280" stroke-width="1.5"/>
            <rect x="50" y="140" width="100" height="70" rx="20" fill="#1a1630" stroke="#312c55" stroke-width="2"/>
            <circle cx="100" cy="165" r="10" fill="#7c5cfc" opacity=".6"/><circle cx="100" cy="165" r="6" fill="#a78bfa"/>
            <rect x="65" y="185" width="20" height="8" rx="4" fill="#312c55"/>
            <rect x="115" y="185" width="20" height="8" rx="4" fill="#312c55"/>
            <rect x="14" y="145" width="28" height="50" rx="14" fill="#231e3d" stroke="#312c55" stroke-width="1.5"/>
            <rect x="158" y="145" width="28" height="50" rx="14" fill="#231e3d" stroke="#312c55" stroke-width="1.5"/>
            <circle cx="28" cy="200" r="10" fill="#312c55"/>
            <circle cx="172" cy="200" r="10" fill="#312c55"/>
          </g>
        </svg>
      </div>

      <!-- Chat: robot bubble + student bubble -->
      <div class="chat-area" id="chatArea">
        <div class="robot-bubble" id="robotBubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <!-- No speech API banner -->
    <div class="nospeech-banner" id="nospeechBanner">
      ⚠️ Your browser doesn't support speech recognition. Please use Chrome or Edge.
    </div>

    <!-- Hint suggested answer template -->
    <div class="hint-section" id="hintSection" style="display:none">
      <div class="hint-label">💡 HINT — SAY THIS ANSWER & FILL THE BLANK:</div>

<script>
// ═══════════════════ CONFIG ═══════════════════
const ELEVEN_VOICE = 'EXAVITQu4vr4xnSDxMaL';

// Warm up voices
if (window.speechSynthesis) { speechSynthesis.getVoices(); }

// ═══════════════════ STARS ════════════════════
(()=>{ const c=document.getElementById('stars'); for(let i=0;i<120;i++){const s=document.createElement('div'),sz=Math.random()*2.5+.5;s.className='star';s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s`;c.appendChild(s);}})();

// ═══════════════════ STATE ════════════════════
const urlParams = new URLSearchParams(window.location.search);
let rawLevel = urlParams.get('level') || 'learner';
rawLevel = rawLevel.toLowerCase();

let selectedLevel = 'learner';
if (rawLevel.includes('kindergarten') || rawLevel.includes('kindergarden') || rawLevel.includes('kids-2-5')) {
  selectedLevel = 'kindergarten';
} else if (rawLevel.includes('kid') || rawLevel.includes('primary') || rawLevel.includes('grade')) {
  selectedLevel = 'kid';
} else if (rawLevel.includes('teen')) {
  selectedLevel = 'teen';
} else {
  selectedLevel = 'learner';
}
let initialSpeed = localStorage.getItem('cupcakes_speech_speed');
if (initialSpeed !== '0.75' && initialSpeed !== '0.85' && initialSpeed !== '0.95') {
  initialSpeed = '0.75';
}
let state = { topic:'', level:'', history:[], turn:0, phase:'idle', isClearing: false, showTranslation: false, currentTranslation: '', speechSpeed: parseFloat(initialSpeed), suggestedTemplate: '', tokens: [] };
// phase: idle | robot-speaking | listening | processing

const LEVEL_CONFIG = {
  kindergarten: { label:'🧒 Kindergarten', words:'3-5',  vocab:'extremely simple words (colors, animals, yes/no)', style:'very short simple sentences' },
  kid:          { label:'👦 Kid',          words:'5-8',  vocab:'everyday simple words',                           style:'simple present tense' },
  teen:         { label:'🧑 Teen',         words:'8-12', vocab:'varied vocabulary',                               style:'mix of tenses' },
  learner:      { label:'📖 Learner A2',   words:'6-10', vocab:'A2 CEFR vocabulary',                             style:'simple past and future' },
};

// --- Word-by-word Fuzzy Matching (Shadowing Books Style) ---
function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) =>
    Array.from({ length: n + 1 }, (_, j) => (i === 0 ? j : j === 0 ? i : 0))
  );
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function cleanWord(w) {
  return (w || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function fuzzyWordMatch(spoken, target) {
  const s = cleanWord(spoken);
  const t = cleanWord(target);
  if (!s || !t) return false;
  if (s === t) return true;
  if (s.length >= 3 && t.length >= 3 && (s.includes(t) || t.includes(s))) return true;
  const maxLen = Math.max(s.length, t.length);
  const dist = levenshtein(s, t);
  return maxLen <= 4 ? dist <= 1 : dist <= 2;
}

// Generate 4-6 distinct alternate hint template options for a question
function generateAlternateHintTemplates(question, baseTemplate) {
  const templates = [];
  if (baseTemplate && baseTemplate.includes('____')) {
    templates.push(baseTemplate);
  }

  const q = (question || '').toLowerCase();
  
  // Extract key noun from question
  const words = q.replace(/[^a-z\s]/g, '').split(/\s+/).filter(Boolean);
  const stopWords = ['what', 'is', 'your', 'favorite', 'do', 'you', 'like', 'have', 'a', 'an', 'the', 'how', 'many', 'where', 'who', 'why', 'are', 'so', 'too', 'cute', 'fun', 'great', 'good'];
  let keyNoun = '';
  for (let i = words.length - 1; i >= 0; i--) {
    if (words[i].length > 2 && !stopWords.includes(words[i])) {
      keyNoun = words[i];
      break;
    }
  }

  if (q.includes('favorite')) {
    const topic = keyNoun || 'thing';
    templates.push(`My favorite ${topic} is ____.`);
    templates.push(`I really love ____.`);
    templates.push(`The ${topic} I like most is ____.`);
    templates.push(`I think ____ is my favorite.`);
  } else if (q.includes('do you have') || q.includes('have a') || q.includes('got a')) {
    const item = keyNoun || 'cat';
    templates.push(`I have a ____ ${item}.`);
    templates.push(`Yes, I have a ____ ${item}.`);
    templates.push(`No, I don't have a ${item} because ____.`);
    templates.push(`My ${item} is ____.`);
    templates.push(`I want to get a ____ ${item}.`);
  } else if (q.includes('like') || q.includes('enjoy') || q.includes('love')) {
    const item = keyNoun || 'it';
    templates.push(`I really like ____.`);
    templates.push(`Yes, I love ____ ${item}.`);
    templates.push(`My favorite thing is ____.`);
    templates.push(`I enjoy ____.`);
  } else if (q.includes('what do you do') || q.includes('what do you')) {
    templates.push(`I usually ____.`);
    templates.push(`In my free time, I ____.`);
    templates.push(`I like to ____.`);
    templates.push(`I always ____.`);
  } else if (q.includes('what color')) {
    templates.push(`It is ____.`);
    templates.push(`My favorite color is ____.`);
    templates.push(`The color is ____.`);
    templates.push(`I like ____.`);
  } else {
    if (keyNoun) {
      templates.push(`My ${keyNoun} is ____.`);
      templates.push(`I like ____ ${keyNoun}.`);
      templates.push(`Yes, ____ is my ${keyNoun}.`);
    }
    templates.push(`I like ____.`);
    templates.push(`My answer is ____.`);
    templates.push(`I think ____.`);
  }

  const unique = [];
  const seen = new Set();
  for (const t of templates) {
    if (!t || !t.includes('____')) continue;
    const clean = t.trim().toLowerCase();
    if (!seen.has(clean)) {
      seen.add(clean);
      unique.push(t.trim());
    }
  }

  return unique.length > 0 ? unique : [baseTemplate || 'My answer is ____.'];
}

// Tokenize hint template (e.g. "My favorite animal is ____.")
function initTemplateTokens(templateStr) {
  if (!templateStr) return [];
  const words = templateStr.trim().split(/\s+/).filter(Boolean);
  return words.map((w) => {
    const isBlank = w.includes('____');
    const clean = isBlank ? '____' : cleanWord(w);
    return {
      original: w,
      clean: clean,
      isBlank: isBlank,
      isRead: false,
      filledWord: null,
    };
  });
}

function renderHintTemplate() {
  const container = document.getElementById('hintTokens');
  const sec = document.getElementById('hintSection');
  const card = document.getElementById('hintCard');
  if (!container || !sec) return;

  sec.style.display = 'block';

  if (card) {
    if (state.phase === 'listening') {
      card.classList.remove('blurred');
    } else {
      card.classList.add('blurred');
    }
  }
  if (!state.tokens || state.tokens.length === 0) {
    container.innerHTML = '<span style="color:var(--muted); font-size:0.95rem;">Generating answer template...</span>';
    return;
  }

  container.innerHTML = '';
  state.tokens.forEach((tok) => {
    const span = document.createElement('span');
    if (tok.isBlank) {
      span.className = `token-blank ${tok.filledWord ? 'filled' : ''}`;
      const punct = tok.original.replace(/^_*([.,!?:;]*)$/, '$1');
      span.textContent = tok.filledWord ? (tok.filledWord + (punct || '')) : '____';
    } else {
      span.className = `token-word ${tok.isRead ? 'read' : ''}`;
      span.textContent = tok.original;
    }
    container.appendChild(span);
  });
}

// Helper to prevent phrase duplication (e.g. "I can play I can play" -> "I can play")
function hasDeduplicatedPhrase(existingPhrase, newWord) {
  const fullWords = (existingPhrase + ' ' + newWord).trim().split(/\s+/);
  const n = fullWords.length;
  if (n < 4 || n % 2 !== 0) return false;
  const half = n / 2;
  const firstHalf = fullWords.slice(0, half).join(' ');
  const secondHalf = fullWords.slice(half).join(' ');
  return firstHalf.toLowerCase() === secondHalf.toLowerCase();
}

// Process real-time spoken tokens (Speech Position Cursor Algorithm + Multi-word Phrase Accumulation)
function processSpokenTokens(transcriptText) {
  if (!state.tokens || state.tokens.length === 0 || !transcriptText) return;

  const spokenWords = transcriptText.toLowerCase().split(/\s+/).map(cleanWord).filter(Boolean);
  const fillers = ['uh', 'um', 'ah', 'er', 'eh', 'like', 'oh', 'well'];

  // Reset tokens read & filled state for clean alignment pass over accumulated transcript
  state.tokens.forEach(t => {
    t.isRead = false;
    t.filledWord = null;
  });

  // Track the speech position cursor index in state.tokens
  let cursorIdx = 0;

  for (const spoken of spokenWords) {
    if (!spoken || cursorIdx >= state.tokens.length) continue;

    // Check if token at cursorIdx is BLANK
    const currentToken = state.tokens[cursorIdx];

    if (currentToken && currentToken.isBlank) {
      if (fillers.includes(spoken)) continue;

      // Lookahead: Check if this spoken word matches any non-blank token AFTER current blank position
      let nextMatchIdx = -1;
      for (let j = cursorIdx + 1; j < state.tokens.length; j++) {
        const tok = state.tokens[j];
        if (!tok.isBlank && fuzzyWordMatch(spoken, tok.clean)) {
          nextMatchIdx = j;
          break;
        }
      }

      if (nextMatchIdx !== -1) {
        // Spoken word matches a non-blank token after blank (student reached next part of template)!
        state.tokens[nextMatchIdx].isRead = true;
        cursorIdx = nextMatchIdx + 1; // Advance cursor past matched token
        continue;
      }

      // Multi-word phrase accumulation inside the blank token
      if (!currentToken.filledWord) {
        currentToken.filledWord = spoken;
        currentToken.isRead = true;
      } else {
        // Prevent single word repetition (e.g. "play play") and phrase repetition ("I can play I can play")
        const existingWords = currentToken.filledWord.split(' ');
        const lastWord = cleanWord(existingWords[existingWords.length - 1]);
        if (lastWord !== spoken && !hasDeduplicatedPhrase(currentToken.filledWord, spoken)) {
          currentToken.filledWord += ' ' + spoken;
        }
      }
      continue;
    }

    // Cursor is at a NON-BLANK token: Lookahead window of up to 3 tokens for non-blank match
    let matchFoundIdx = -1;
    const lookaheadEnd = Math.min(state.tokens.length, cursorIdx + 3);

    for (let i = cursorIdx; i < lookaheadEnd; i++) {
      const tok = state.tokens[i];
      if (!tok.isBlank && fuzzyWordMatch(spoken, tok.clean)) {
        matchFoundIdx = i;
        break;
      }
    }

    if (matchFoundIdx !== -1) {
      state.tokens[matchFoundIdx].isRead = true;
      cursorIdx = matchFoundIdx + 1; // Advance cursor past matched token
      continue;
    }

    // Check if spoken word is a repetition of a past read token
    const isPastRepetition = state.tokens.some((tok, idx) => idx < cursorIdx && !tok.isBlank && tok.isRead && fuzzyWordMatch(spoken, tok.clean));
    if (isPastRepetition) {
      continue;
    }

    // Unmatched filler/extra word spoken before reaching blank token: ignore and do not advance cursor
  }

  renderHintTemplate();
}

// Determine final text (50% mismatch check — Phương án B)
function determineFinalSpoken(rawSpoken) {
  if (!state.tokens || state.tokens.length === 0) return rawSpoken;

  const nonBlankTokens = state.tokens.filter(t => !t.isBlank);
  if (nonBlankTokens.length === 0) return rawSpoken;

  const readCount = nonBlankTokens.filter(t => t.isRead).length;
  const matchRatio = readCount / nonBlankTokens.length;

  console.log(`[RobotChat] Words matched: ${readCount}/${nonBlankTokens.length} (${(matchRatio * 100).toFixed(0)}%)`);

  if (matchRatio >= 0.35) {
    // Matched >= 35%: Assemble filled template sentence
    const assembled = state.tokens.map(t => {
      if (t.isBlank) {
        return t.filledWord || '____';
      }
      return t.original;
    }).join(' ').replace(/\s+([.,!?:;])/g, '$1');
    console.log(`[RobotChat] Matched >= 35%, using assembled template: "${assembled}"`);
    return assembled;
  } else {
    // Mismatch > 65%: Student spoke freestyle / different answer (Phương án B)
    console.log(`[RobotChat] Mismatch > 65%, using freeform spoken text: "${rawSpoken}"`);
    return rawSpoken;
  }
}

// ═══════════════════ WELCOME EVENTS ═══════════════════
document.getElementById('btnStart').addEventListener('click', async () => {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
    } catch (err) {
      console.warn("Microphone permission denied or error:", err);

document.getElementById('btnNew').addEventListener('click',()=>{ stopAudio(); stopListening(); showScreen('welcome'); });

// ═══════════════════ GAME START ═══════════════════
const TOPICS = ['Animals', 'Food', 'Colors', 'Family', 'School', 'Sports', 'Nature', 'Daily Life', 'Hobbies', 'Weather', 'Toys', 'Travel'];

function pickRandomTopic() {
  return TOPICS[Math.floor(Math.random() * TOPICS.length)];
}

function startGame(level){
  const isChecked = document.getElementById('toggleTranslate')?.checked || false;
  
  let speedVal = localStorage.getItem('cupcakes_speech_speed');
  if (speedVal !== '0.75' && speedVal !== '0.85' && speedVal !== '0.95') speedVal = '0.75';
  
  const selectEl = document.getElementById('speedSelect');
  if (selectEl) selectEl.value = speedVal;

  const topic = pickRandomTopic();
  state={topic,level,history:[],turn:0,phase:'idle',isClearing:false,showTranslation:isChecked,currentTranslation:'',speechSpeed:parseFloat(speedVal),suggestedTemplate:'',tokens:[]};
  document.getElementById('badgeLevel').textContent=LEVEL_CONFIG[level].label;
  document.getElementById('chatArea').innerHTML='';
  document.getElementById('hintSection').style.display='none';
  showScreen('game');
  setRobotState('thinking');
  setMicStatus('loading','Generating question...');
  robotTurn(null);
}

// ═══════════════════ MAIN LOOP ════════════════════
async function robotTurn(studentSpeech){
  stopListening();

  state.turn++;
  state.phase='processing';
  document.getElementById('turnInfo').textContent=`Turn ${state.turn}`;
  setMicBtn(false);
  showTyping();
  setRobotState('thinking');
  document.getElementById('hintSection').style.display='none';

  try {
    const {robotSays,translatedSays,suggestedAnswer,suggestedAnswers} = await callOpenAI(studentSpeech);
    if(studentSpeech) state.history.push({role:'user',text:studentSpeech});
    state.history.push({role:'robot',text:robotSays});
    if(state.history.length>14) state.history=state.history.slice(-14);

    // Kick off TTS fetch IMMEDIATELY — parallel with all UI rendering below
    const ttsPromise = prefetchTTS(robotSays);

    state.currentTranslation = translatedSays || '';
    
    const openAiTemplates = (suggestedAnswers && suggestedAnswers.length > 0) ? suggestedAnswers : [suggestedAnswer];
    const generatedTemplates = generateAlternateHintTemplates(robotSays, suggestedAnswer || openAiTemplates[0]);
    const allTemplates = [];
    const seen = new Set();
    [...openAiTemplates, ...generatedTemplates].forEach(t => {
      if (t && t.includes('____')) {
        const key = t.trim().toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          allTemplates.push(t.trim());
        }
      }
    });

    state.suggestedTemplates = allTemplates;
    state.templateIndex = 0;
    state.suggestedTemplate = state.suggestedTemplates[0];
    state.tokens = initTemplateTokens(state.suggestedTemplate);

    showRobotBubble(robotSays, state.currentTranslation);
    setMicStatus('loading', 'ROBO is thinking...');
    renderHintTemplate();

    await speakText(robotSays, () => {
      // Callback triggers when audio starts playing
      setRobotState('speaking');
      state.phase='robot-speaking';
      setMicStatus('loading','ROBO is talking...');
      renderHintTemplate();
    }, ttsPromise);
    setRobotState('idle');

    state.phase = 'listening';
    renderHintTemplate();
    setMicStatus('listening', '🎤 Your turn — speak your answer!');

    // Mic bật tự động sau khi robot nói xong
    setTimeout(() => autoStartListening(), 700);

  } catch(err){
    console.error(err);
    showRobotBubble('⚠️ '+err.message, null, 'error');
    setMicStatus('idle','Error — try again');
    setMicBtn(true);
    state.phase='idle';
  }
}

// ═══════════════════ OPENAI ═══════════════════
async function callOpenAI(studentSpeech){
  const urlParams = new URLSearchParams(window.location.search);
  const nativeLang = urlParams.get('nativeLang') || 'vi';
  const langNames = { vi: 'Vietnamese', th: 'Thai', id: 'Indonesian', en: 'English' };
  const targetLangName = langNames[nativeLang] || 'Vietnamese';

  const lc=LEVEL_CONFIG[state.level];
  const historyMsgs=state.history.map(h=>({role:h.role==='robot'?'assistant':'user',content:h.text}));
  const userMsg = studentSpeech
    ? studentSpeech
    : `[CONVERSATION START]`;

  const blankRule = (state.level === 'kindergarten' || state.level === 'kid')
    ? 'CRITICAL: The suggestedAnswer MUST contain EXACTLY ONE fill-in-the-blank placeholder represented as "____". Example: "My favorite animal is ____."'
    : 'CRITICAL: The suggestedAnswer MUST contain 1 or 2 fill-in-the-blank placeholders represented as "____". Example: "I like ____ because they are ____." or "My favorite animal is ____."';

  const systemPrompt=`You are ROBO, a friendly English-speaking robot teacher chatting with a student.
Student level: ${state.level}.

TOPIC RULES:
- The opening topic for this session is: **${state.topic}**. Start the conversation with this topic.
- For the first 3-4 turns, stay on that opening topic to build vocabulary depth.
- After that, follow the conversation naturally — transition to related topics as they come up organically. Do NOT force staying on one topic forever.
- Always use vocabulary and sentence complexity appropriate for level: ${state.level} (${lc.vocab}, ${lc.style}).

CONVERSATION RULES:
- Robot sentence: ${lc.words} words MAX.
- CRITICAL: Your response (the 'robotSays' text) MUST ALWAYS end with a direct question (?). The last character of 'robotSays' MUST be a question mark. Statements are forbidden. You must ask a question in EVERY turn.
- CRITICAL: The text in 'robotSays' MUST be 100% in English. Absolutely NO Vietnamese, Thai, Indonesian, or other non-English words are allowed in 'robotSays'.
- React briefly to what the student said (1 short sentence), then ask a new question.
- Be warm, encouraging, and fun.
- Ask ONE question per turn — keep the conversation flowing.
- Translate your English response into ${targetLangName} and put it in 'translatedSays'.

CRITICAL about suggestedAnswers:
- Provide an array of 3 distinct, natural suggested answer templates in English that directly answer your question, each using different phrasing or structure.
- ${blankRule}
- The blank "____" MUST correspond to the answer to your question. For example, if you ask "What color is your car toy?", suggestedAnswers MUST be ["My car toy is ____.", "I have a ____ car toy.", "The color of my car toy is ____."]

Respond ONLY with valid JSON format:
{
  "robotSays": "Your short reaction (in 100% English only). Followed by a direct question (in 100% English only) ending with '?'",
  "translatedSays": "Translation of robotSays in ${targetLangName}",
  "suggestedAnswers": [
    "Suggested answer template 1 with ____ blank(s)",
    "Suggested answer template 2 with ____ blank(s)",
    "Suggested answer template 3 with ____ blank(s)"
  ]
}`;

  const res=await fetch('/api/games/robot-chat/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({systemPrompt, historyMsgs, userMsg})
  });
  if(!res.ok){
    const d=await res.json().catch(()=>({}));
    throw new Error(`API HTTP ${res.status}: ${d?.error?.message||JSON.stringify(d)}`);
  }
  const data=await res.json();
  const parsed=JSON.parse(data.choices[0].message.content||'{}');
  let robotSays = (parsed.robotSays || '...').trim();
  let translatedSays = (parsed.translatedSays || '').trim();

  // Programmatic fallback: Ensure robotSays ends with a question mark
  if (robotSays && !robotSays.endsWith('?')) {
    console.warn("[RobotChat] Bot response did not end with a question mark. Appending fallback question.");
    const langFallbacks = {
      vi: { en: " What do you think?", trans: " Bạn nghĩ sao?" },
      th: { en: " What do you think?", trans: " คุณคิดอย่างไร?" },
      id: { en: " What do you think?", trans: " Bagaimana menurutmu?" },
      en: { en: " What do you think?", trans: "" }
    };
    const selectFallback = langFallbacks[nativeLang] || langFallbacks.vi;
    
    robotSays += selectFallback.en;
    if (translatedSays && selectFallback.trans) {
      translatedSays += selectFallback.trans;
    }
  }

  let list = [];
  if (Array.isArray(parsed.suggestedAnswers) && parsed.suggestedAnswers.length > 0) {
    list = parsed.suggestedAnswers.map(s => s.trim()).filter(s => s.includes('____'));
  }
  if (list.length === 0) {
    let single = (parsed.suggestedAnswer || parsed.suggestedTemplate || '').trim();
    if (!single || !single.includes('____')) single = 'My answer is ____.';
    list = [single];
  }

  return {
    robotSays,
    translatedSays,
    suggestedAnswer: list[0],
    suggestedAnswers: list
  };
}

let currentAudio = null;

function stopAudio() {
  try { if(currentAudio) { currentAudio.pause(); currentAudio=null; } } catch{}
}

// Pre-fetch TTS audio and return a Promise<string> (blob URL)
async function prefetchTTS(text) {
  try {
    const url = `/api/games/robot-chat/tts?text=${encodeURIComponent(text)}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`TTS prefetch failed: ${response.status}`);
    const blob = await response.blob();
    return URL.createObjectURL(blob);
  } catch (err) {
    console.error('[RobotChat] TTS prefetch failed:', err);
    return null;
  }
}

// Speak text — accepts optional pre-fetched blob URL promise to avoid delay
async function speakText(text, onStart, blobUrlPromise) {
  stopAudio();

  return new Promise(async (resolve) => {
    try {
      // Await the pre-fetched blob URL (should already be ready or nearly ready)
      const blobUrl = blobUrlPromise ? await blobUrlPromise : await prefetchTTS(text);

      if (!blobUrl) {
        // Fallback to browser speech synthesis
        browserSpeak(text).then(resolve);
        return;
      }

      const audio = new Audio();
      currentAudio = audio;
      audio.src = blobUrl;

      audio.onplay = () => {
        if (onStart) onStart();
      };

      audio.onended = () => {
        URL.revokeObjectURL(blobUrl);
        resolve();
      };

      audio.onerror = (e) => {
        console.error("Audio playback error, falling back to browser speak:", e);
        URL.revokeObjectURL(blobUrl);
        browserSpeak(text).then(resolve);
      };

      audio.play().catch(err => {
        console.error("Audio play call failed, falling back:", err);
        browserSpeak(text).then(resolve);
      });
    } catch (err) {
      console.error("speakText failed:", err);
      browserSpeak(text).then(resolve);
    }
  });
}

function browserSpeak(text) {
  return new Promise(r => {
    if (!window.speechSynthesis) return r();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = state.speechSpeed;
    
    // Nếu là Kindergarten hoặc Kid, nâng pitch để giả lập giọng trẻ con
    if (state.level === 'kindergarten' || state.level === 'kid') {
      u.pitch = 1.45;
    } else {
      u.pitch = 1.15;
    }
    
    u.lang = 'en-US';
    
    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) {
      // Ưu tiên chọn giọng nữ tiếng Anh của Google hoặc Microsoft Zira
      const preferred = voices.find(v => 
        v.lang.startsWith('en') && 
        (v.name.includes('Google US English') || v.name.includes('Zira') || v.name.includes('Hazel') || v.name.includes('Female'))
      );
      if (preferred) {
        u.voice = preferred;
      }
    }
    
    u.onend = r;
    u.onerror = r;
    speechSynthesis.speak(u);
  });
}

// MediaRecorder for Deepgram STT
let mediaRecorder = null;
let audioChunks = [];
let micStream = null;

async function startMediaRecorder() {
  try {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
    }
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
    mediaRecorder = new MediaRecorder(micStream, { mimeType });
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.start(100); // collect chunks every 100ms
    console.log('[STT] MediaRecorder started, mimeType:', mimeType);
  } catch (err) {
    console.warn('[STT] MediaRecorder unavailable:', err.message);
    mediaRecorder = null;
  }
}

function stopMediaRecorder() {
  return new Promise((resolve) => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
      resolve(null);
      return;
    }
    mediaRecorder.onstop = () => {
      const mimeType = mediaRecorder.mimeType || 'audio/webm';
      const blob = new Blob(audioChunks, { type: mimeType });
      audioChunks = [];
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

async function transcribeWithDeepgram(audioBlob) {
  if (!audioBlob || audioBlob.size < 1000) return null;
  try {
    const res = await fetch('/api/games/robot-chat/stt', {
      method: 'POST',
      headers: { 'Content-Type': audioBlob.type },
      body: audioBlob,
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.transcript || null;
  } catch (err) {
    console.warn('[STT] Deepgram transcription failed:', err.message);
    return null;
  }
}

    document.getElementById('doneBtn').classList.remove('hidden');
    document.getElementById('btnUndoHint')?.classList.remove('hidden');
    setMicStatus('listening', '🔴 Listening... say your answer!');
  };

  r.onresult = (e) => {
    let finalTx = '';
    let interimTx = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalTx += e.results[i][0].transcript + ' ';
      } else {
        interimTx += e.results[i][0].transcript;
      }
    }
    fullTranscript = (finalTx + interimTx).trim();
    const val = fullTranscript;
    console.log('[RobotChat Live STT]:', val);
    
    // Live word-by-word yellow highlighting & fill-in-the-blank
    processSpokenTokens(val);
  };

  r.onend = () => {
    isListening = false;
    document.getElementById('micIcon').style.display = '';
    document.getElementById('waveformBars').classList.remove('active');
    document.getElementById('doneBtn').classList.add('hidden');
    document.getElementById('btnUndoHint')?.classList.add('hidden');

    let spoken = fullTranscript.trim();

    if (state.isClearing) {
      state.isClearing = false;
      if (state.phase === 'listening') {
        setMicStatus('listening', '🎤 Ready to listen...');
        setTimeout(() => autoStartListening(), 200);
      }
      return;
    }

    if (spoken && state.phase === 'listening') {
      // Check for echo of the robot's own question
      const lastRobotSays = state.history.filter(h => h.role === 'robot').pop()?.text || '';
      if (lastRobotSays) {
        const cleanSpoken = spoken.toLowerCase().replace(/[^a-z0-9]/g, '');
        const cleanRobot = lastRobotSays.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (cleanRobot.includes(cleanSpoken) && cleanSpoken.length > 10) {
          console.warn("Echo detected and ignored:", spoken);
          setMicStatus('listening', '🎤 Echo detected, try speaking now...');
          setTimeout(() => autoStartListening(), 500);
          return;
        }
      }

      processSpokenTokens(spoken);
      const finalText = determineFinalSpoken(spoken);
      state.phase = 'processing';
      setMicStatus('processing', '⏳ Processing...');
      submitSpeech(finalText);
    } else if (state.phase === 'listening') {
      // Nothing heard — restart
      setMicStatus('listening', '🎤 Nothing heard, try again...');
      setTimeout(() => autoStartListening(), 800);
    }
  };

  r.onerror = (e) => {
    isListening = false;
    document.getElementById('micIcon').style.display = '';
    document.getElementById('waveformBars').classList.remove('active');
    document.getElementById('doneBtn').classList.add('hidden');
    document.getElementById('btnUndoHint')?.classList.add('hidden');
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      if (e.error === 'not-allowed') {
        showToast('Microphone access denied. Please enable it in browser settings. 🎙️');
      } else {
        showToast('Mic error: ' + e.error);
      }
    }
    if (state.phase === 'listening') {
      setMicStatus('listening', '🎤 Ready to listen...');
    }
  };

  return r;
}

async function correctSpeechWithAI(rawTranscript) {
  try {
    const lastRobotQuestion = state.history.filter(h => h.role === 'robot').pop()?.text || '';
    if (!lastRobotQuestion || !rawTranscript?.trim()) return rawTranscript;

    const res = await fetch('/api/games/robot-chat/correct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        rawTranscript,
        robotQuestion: lastRobotQuestion,
        suggestedAnswers: state.keywords || [],
      }),
    });
    if (!res.ok) return rawTranscript;
    const data = await res.json();
    return data.corrected?.trim() || rawTranscript;
  } catch (err) {
    console.warn('[ASR Correct] Failed, using raw:', err.message);
    return rawTranscript;
  }
}

function changeHintTemplate(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  const lastRobotSays = state.history.filter(h => h.role === 'robot').pop()?.text || '';

  if (!state.suggestedTemplates || state.suggestedTemplates.length <= 1) {
    state.suggestedTemplates = generateAlternateHintTemplates(lastRobotSays, state.suggestedTemplate);
    state.templateIndex = 0;
  }

  if (!state.suggestedTemplates || state.suggestedTemplates.length <= 1) {
    state.suggestedTemplates = [
      state.suggestedTemplate || 'My answer is ____.',
      'I really love ____.',
      'My favorite thing is ____.',
      'I think ____ is great.'
    ];
    state.templateIndex = 0;
  }

  const prevIdx = state.templateIndex || 0;
  state.templateIndex = (prevIdx + 1) % state.suggestedTemplates.length;
  state.suggestedTemplate = state.suggestedTemplates[state.templateIndex];
  state.tokens = initTemplateTokens(state.suggestedTemplate);
  
  console.log(`[RobotChat Change Hint] Advanced from ${prevIdx} to ${state.templateIndex}/${state.suggestedTemplates.length}: "${state.suggestedTemplate}"`);

  renderHintTemplate();
  
  if (isListening) {
    state.isClearing = true;
    stopListening(); // restarts recognition smoothly with clean transcript
  }
  showToast(`✨ Changed hint: "${state.suggestedTemplate}"`);
}

function levenshteinDistance(s1, s2) {
  const m = s1.length, n = s2.length;
  const d = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = s1[i - 1].toLowerCase() === s2[j - 1].toLowerCase() ? 0 : 1;
      d[i][j] = Math.min(
        d[i - 1][j] + 1, // deletion
        d[i][j - 1] + 1, // insertion
        d[i - 1][j - 1] + cost // substitution
      );
    }
  }
  return d[m][n];
}

function fuzzyCorrectSpeech(spoken, keywords) {
  if (!spoken || !keywords || keywords.length === 0) return spoken;
  
  const cleanSpoken = spoken.toLowerCase().trim().replace(/[^a-z0-9\s]/g, '');
  
  // 1. Try matching the whole phrase against keywords (allow 40% difference)
  for (const kw of keywords) {
    const cleanKw = kw.toLowerCase().trim().replace(/[^a-z0-9\s]/g, '');
    const dist = levenshteinDistance(cleanSpoken, cleanKw);
    if (dist <= Math.max(1, Math.floor(cleanKw.length * 0.40))) {
      console.log(`[Fuzzy] Matched entire phrase: "${spoken}" -> "${kw}"`);
      return kw;
    }
  }
  
  // 2. Try word-by-word matching (allow 50% difference for words longer than 1 character)
  const words = spoken.split(/\s+/);
  const correctedWords = words.map(word => {
    const cleanWord = word.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (cleanWord.length < 2) return word;
    
    let bestMatch = word;
    let minDistance = 999;
    
    for (const kw of keywords) {
      const kwWords = kw.split(/\s+/);
      for (const kwWord of kwWords) {
        const cleanKwWord = kwWord.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (cleanKwWord.length < 2) continue;
        
        const dist = levenshteinDistance(cleanWord, cleanKwWord);
        if (dist < minDistance && dist <= Math.max(1, Math.floor(cleanKwWord.length * 0.50))) {
          minDistance = dist;
          bestMatch = kwWord;
        }
      }
    }
    return bestMatch;
  });
  
  return correctedWords.join(' ');
}
